<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DEXA Data Upload & Visualization</title>
    <script src="d3/d3.v7.min.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            position: relative;
            overflow-x: hidden;
        }

        /* Dashboard Background */
        #dashboard-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 1;
        }

        /* Upload Overlay */
        .upload-overlay {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 90%;
            max-width: 700px;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(20px);
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            z-index: 1000;
            animation: slideIn 0.5s ease-out;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translate(-50%, -60%);
            }
            to {
                opacity: 1;
                transform: translate(-50%, -50%);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 30px;
        }

        .header h1 {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            font-size: 2rem;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.95rem;
        }

        /* Upload Area */
        .upload-zone {
            border: 3px dashed #667eea;
            border-radius: 15px;
            padding: 50px 20px;
            text-align: center;
            cursor: pointer;
            transition: all 0.3s ease;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            margin-bottom: 20px;
            position: relative;
        }

        .upload-zone:hover {
            border-color: #764ba2;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            transform: scale(1.02);
        }

        .upload-zone.dragover {
            border-color: #4CAF50;
            background: linear-gradient(135deg, rgba(76, 175, 80, 0.1), rgba(102, 187, 106, 0.1));
            transform: scale(1.05);
        }

        .upload-icon {
            font-size: 3.5rem;
            margin-bottom: 15px;
            display: block;
        }

        .upload-text {
            font-size: 1.2rem;
            color: #333;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .upload-subtext {
            color: #666;
            font-size: 0.9rem;
        }

        .file-input {
            display: none;
        }

        /* Selected Files List */
        .file-list {
            max-height: 250px;
            overflow-y: auto;
            margin-bottom: 20px;
            display: none;
        }

        .file-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 15px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05), rgba(118, 75, 162, 0.05));
            border-radius: 8px;
            margin-bottom: 8px;
            transition: all 0.2s ease;
        }

        .file-item:hover {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1), rgba(118, 75, 162, 0.1));
            transform: translateX(5px);
        }

        .file-name {
            flex: 1;
            font-weight: 500;
            color: #333;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        .file-size {
            color: #666;
            font-size: 0.85rem;
            margin: 0 15px;
        }

        .remove-btn {
            background: #ff4757;
            color: white;
            border: none;
            padding: 6px 12px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 0.85rem;
            transition: all 0.2s ease;
        }

        .remove-btn:hover {
            background: #ee5a6f;
            transform: scale(1.05);
        }

        /* Process Button */
        .process-btn {
            width: 100%;
            padding: 15px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.4);
        }

        .process-btn:hover:not(:disabled) {
            transform: translateY(-2px);
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.6);
        }

        .process-btn:disabled {
            background: linear-gradient(135deg, #ccc, #999);
            cursor: not-allowed;
            box-shadow: none;
        }

        /* Loading Animation */
        .loading {
            display: none;
            text-align: center;
            margin: 20px 0;
        }

        .spinner {
            border: 4px solid rgba(102, 126, 234, 0.2);
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 1s linear infinite;
            margin: 0 auto 15px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* Results Dashboard */
        .results-dashboard {
            display: none;
            animation: fadeIn 0.5s ease-in;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
            margin-bottom: 25px;
        }

        .stat-card {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 5px 15px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
        }

        .stat-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 10px 25px rgba(102, 126, 234, 0.5);
        }

        .stat-number {
            font-size: 2rem;
            font-weight: bold;
            margin-bottom: 5px;
        }

        .stat-label {
            font-size: 0.85rem;
            opacity: 0.9;
        }

        /* Data Table */
        .data-preview {
            background: white;
            border-radius: 12px;
            padding: 20px;
            max-height: 400px;
            overflow-y: auto;
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1);
        }

        .data-preview h3 {
            color: #667eea;
            margin-bottom: 15px;
        }

        .data-table {
            width: 100%;
            border-collapse: collapse;
            font-size: 0.85rem;
        }

        .data-table th {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 10px;
            text-align: left;
            position: sticky;
            top: 0;
        }

        .data-table td {
            padding: 8px 10px;
            border-bottom: 1px solid #eee;
        }

        .data-table tr:hover {
            background: rgba(102, 126, 234, 0.05);
        }

        /* Error Message */
        .error {
            background: linear-gradient(135deg, #ff4757 0%, #ee5a6f 100%);
            color: white;
            padding: 15px;
            border-radius: 10px;
            margin-bottom: 15px;
            display: none;
            animation: shake 0.5s ease;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Back Button */
        .back-btn {
            position: fixed;
            top: 20px;
            left: 20px;
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            color: #667eea;
            border: 2px solid #667eea;
            padding: 10px 20px;
            border-radius: 25px;
            cursor: pointer;
            font-weight: 600;
            z-index: 1001;
            transition: all 0.3s ease;
        }

        .back-btn:hover {
            background: #667eea;
            color: white;
            transform: translateX(-5px);
        }

        /* Scrollbar Styling */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 10px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <!-- Dashboard Background with D3 visualization -->
    <div id="dashboard-bg"></div>

    <!-- Back Button -->
    <button class="back-btn" onclick="window.location.href='index.html'">← Back to Home</button>

    <!-- Upload Overlay -->
    <div class="upload-overlay">
        <div class="header">
            <h1>🧬 DEXA Data Processor</h1>
            <p>Upload your DEXA scan files and see instant visualizations</p>
        </div>

        <div class="error" id="errorMessage"></div>

        <div class="upload-zone" id="uploadZone">
            <span class="upload-icon">☁️</span>
            <div class="upload-text">Click or Drop Files Here</div>
            <div class="upload-subtext">Supports .txt, .csv, .xlsx, .tif, .png, .jpeg, .img (Max 20 files, 10MB each)</div>
            <input type="file" id="fileInput" class="file-input" multiple 
                   accept=".txt,.csv,.xlsx,.xls,.tif,.pxl,.png,.jpeg,.jpg,.img,.bmp">
        </div>

        <div class="file-list" id="fileList"></div>

        <button class="process-btn" id="processBtn" disabled>
            🚀 Process Files & Visualize
        </button>

        <div class="loading" id="loading">
            <div class="spinner"></div>
            <p style="color: #667eea; font-weight: 600;">Processing your data...</p>
        </div>

        <div class="results-dashboard" id="results">
            <div class="stats-grid" id="statsGrid"></div>
            <div class="data-preview">
                <h3>📊 Data Preview</h3>
                <div id="dataPreview"></div>
            </div>
        </div>
    </div>

    <script>
        // Elements
        const uploadZone = document.getElementById('uploadZone');
        const fileInput = document.getElementById('fileInput');
        const fileList = document.getElementById('fileList');
        const processBtn = document.getElementById('processBtn');
        const loading = document.getElementById('loading');
        const results = document.getElementById('results');
        const errorMessage = document.getElementById('errorMessage');
        const statsGrid = document.getElementById('statsGrid');
        const dataPreview = document.getElementById('dataPreview');

        let selectedFiles = [];
        const MAX_FILES = 20;
        const MAX_SIZE_MB = 10;

        // Initialize D3 background animation
        initDashboardBackground();

        // Upload Zone Events
        uploadZone.addEventListener('click', () => fileInput.click());

        uploadZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            uploadZone.classList.add('dragover');
        });

        uploadZone.addEventListener('dragleave', () => {
            uploadZone.classList.remove('dragover');
        });

        uploadZone.addEventListener('drop', (e) => {
            e.preventDefault();
            uploadZone.classList.remove('dragover');
            handleFiles(e.dataTransfer.files);
        });

        fileInput.addEventListener('change', (e) => {
            handleFiles(e.target.files);
        });

        // Handle Files
        function handleFiles(files) {
            const newFiles = Array.from(files);
            
            // Validate file count
            if (selectedFiles.length + newFiles.length > MAX_FILES) {
                showError(`Maximum ${MAX_FILES} files allowed. Selecting first ${MAX_FILES - selectedFiles.length} files.`);
                selectedFiles = selectedFiles.concat(newFiles.slice(0, MAX_FILES - selectedFiles.length));
            } else {
                selectedFiles = selectedFiles.concat(newFiles);
            }

            displayFiles();
            processBtn.disabled = selectedFiles.length === 0;
            hideError();
        }

        // Display Selected Files
        function displayFiles() {
            if (selectedFiles.length === 0) {
                fileList.style.display = 'none';
                return;
            }

            fileList.style.display = 'block';
            fileList.innerHTML = selectedFiles.map((file, index) => `
                <div class="file-item">
                    <span class="file-name">📄 ${file.name}</span>
                    <span class="file-size">${formatFileSize(file.size)}</span>
                    <button class="remove-btn" onclick="removeFile(${index})">✕</button>
                </div>
            `).join('');
        }

        // Remove File
        function removeFile(index) {
            selectedFiles.splice(index, 1);
            displayFiles();
            processBtn.disabled = selectedFiles.length === 0;
        }

        // Format File Size
        function formatFileSize(bytes) {
            if (bytes === 0) return '0 Bytes';
            const k = 1024;
            const sizes = ['Bytes', 'KB', 'MB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return Math.round((bytes / Math.pow(k, i)) * 100) / 100 + ' ' + sizes[i];
        }

        // Process Button
        processBtn.addEventListener('click', async () => {
            if (selectedFiles.length === 0) return;

            showLoading();
            hideError();
            hideResults();

            try {
                const formData = new FormData();
                selectedFiles.forEach(file => formData.append('files', file));

                const response = await fetch('http://localhost:5001/api/process-dexa', {
                    method: 'POST',
                    body: formData
                });

                const data = await response.json();

                if (response.ok && data.status === 'success') {
                    displayResults(data);
                } else {
                    showError(data.error || 'Processing failed. Please try again.');
                }
            } catch (error) {
                showError('Network error: ' + error.message + '. Make sure the API is running on localhost:5001');
            } finally {
                hideLoading();
            }
        });

        // Display Results
        function displayResults(data) {
            // Stats Cards
            statsGrid.innerHTML = `
                <div class="stat-card">
                    <div class="stat-number">${data.total_records || 0}</div>
                    <div class="stat-label">Total Records</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.files_processed || 0}</div>
                    <div class="stat-label">Files Processed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.duplicates_removed || 0}</div>
                    <div class="stat-label">Duplicates Removed</div>
                </div>
                <div class="stat-card">
                    <div class="stat-number">${data.batches_processed || 0}</div>
                    <div class="stat-label">Batches Found</div>
                </div>
            `;

            // Data Table
            if (data.data && data.data.length > 0) {
                const columns = Object.keys(data.data[0]);
                const displayData = data.data.slice(0, 10);

                let tableHTML = '<table class="data-table"><thead><tr>';
                columns.forEach(col => {
                    tableHTML += `<th>${col}</th>`;
                });
                tableHTML += '</tr></thead><tbody>';

                displayData.forEach(row => {
                    tableHTML += '<tr>';
                    columns.forEach(col => {
                        tableHTML += `<td>${row[col] !== null && row[col] !== undefined ? row[col] : '-'}</td>`;
                    });
                    tableHTML += '</tr>';
                });

                tableHTML += '</tbody></table>';
                
                if (data.data.length > 10) {
                    tableHTML += `<p style="margin-top: 15px; color: #666; font-style: italic; text-align: center;">Showing 10 of ${data.data.length} records</p>`;
                }

                dataPreview.innerHTML = tableHTML;
            } else {
                dataPreview.innerHTML = '<p style="text-align: center; color: #666;">No data to display</p>';
            }

            results.style.display = 'block';
        }

        // Show/Hide Functions
        function showLoading() {
            loading.style.display = 'block';
            processBtn.disabled = true;
        }

        function hideLoading() {
            loading.style.display = 'none';
            processBtn.disabled = false;
        }

        function showError(message) {
            errorMessage.textContent = '⚠️ ' + message;
            errorMessage.style.display = 'block';
            setTimeout(() => hideError(), 5000);
        }

        function hideError() {
            errorMessage.style.display = 'none';
        }

        function hideResults() {
            results.style.display = 'none';
        }

        // D3 Dashboard Background Animation
        function initDashboardBackground() {
            const width = window.innerWidth;
            const height = window.innerHeight;

            const svg = d3.select('#dashboard-bg')
                .append('svg')
                .attr('width', width)
                .attr('height', height);

            // Create animated circles
            const circles = d3.range(30).map(() => ({
                x: Math.random() * width,
                y: Math.random() * height,
                r: Math.random() * 100 + 20,
                vx: (Math.random() - 0.5) * 0.5,
                vy: (Math.random() - 0.5) * 0.5
            }));

            svg.selectAll('circle')
                .data(circles)
                .join('circle')
                .attr('cx', d => d.x)
                .attr('cy', d => d.y)
                .attr('r', d => d.r)
                .attr('fill', (d, i) => i % 2 ? 'rgba(102, 126, 234, 0.1)' : 'rgba(118, 75, 162, 0.1)')
                .attr('opacity', 0.3);

            // Animate
            function animate() {
                circles.forEach(c => {
                    c.x += c.vx;
                    c.y += c.vy;
                    if (c.x < 0 || c.x > width) c.vx *= -1;
                    if (c.y < 0 || c.y > height) c.vy *= -1;
                });

                svg.selectAll('circle')
                    .data(circles)
                    .attr('cx', d => d.x)
                    .attr('cy', d => d.y);

                requestAnimationFrame(animate);
            }

            animate();
        }
    </script>
</body>
</html>
