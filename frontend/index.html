<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="Bio Research Data Analysis">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bio Research Data Visualization</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<div class="container">
		<h1>Schuettpelz Lab - Mouse Relationship Network</h1>

		<!-- Filter Controls -->
		<div id="filter-controls" style="margin: 15px 0;">
			<label for="filterType"><strong>Filter by:</strong></label>
			<select id="filterType">
				<option value="all">All</option>
				<option value="wbc">WBC</option>
				<option value="neutrophils">Neutrophils</option>
				<option value="lymphocytes">Lymphocytes</option>
				<option value="monocytes">Monocytes</option>
				<option value="eosinophils">Eosinophils</option>
				<option value="basophils">Basophils</option>
				<option value="rbc">RBC</option>
				<option value="hemoglobin">Hemoglobin</option>
				<option value="hematocrit">Hematocrit</option>
				<option value="platelets">Platelets</option>
			</select>
	
			<label for="filterMin">Min:</label>
			<input type="number" id="filterMin" step="0.1" style="width:80px;">
			<label for="filterMax">Max:</label>
			<input type="number" id="filterMax" step="0.1" style="width:80px;">
			<button id="applyFilterBtn">Apply Filter</button>
			<button id="resetFilterBtn">Reset</button>
		</div>

		<!-- Link Buttons -->
		<div style="margin: 20px 0;">
			<button id="dexa-upload-btn" onclick="openDexaUpload()">Upload DEXA Files</button>

			<a href="statstests.html" class="button-link" style="margin-left: 10px;">
				<button id="stats-tests-btn">Go to Statistical Tests Page</button>
			</a>
		</div>

		<div id="chart-area"></div>
		
		<!-- DEXA Upload Overlay Modal -->
		<div id="dexaUploadModal" class="dexa-modal">
			<div class="dexa-modal-overlay" onclick="closeDexaUpload()"></div>
			<div class="dexa-modal-content">
				<button class="dexa-close-btn" onclick="closeDexaUpload()">✕</button>
				
				<div class="dexa-header">
					<h2>🧬 DEXA Data Upload</h2>
					<p>Upload files and see results instantly on the dashboard</p>
				</div>

				<div class="dexa-error" id="dexaError"></div>

				<div class="dexa-upload-zone" id="dexaUploadZone">
					<span class="dexa-upload-icon">☁️</span>
					<div class="dexa-upload-text">Click or Drop Files Here</div>
					<div class="dexa-upload-subtext">Supports .txt, .csv, .xlsx, .tif, .png, .jpeg (Max 20 files)</div>
					<input type="file" id="dexaFileInput" class="dexa-file-input" multiple 
						   accept=".txt,.csv,.xlsx,.xls,.tif,.pxl,.png,.jpeg,.jpg,.img,.bmp">
				</div>

				<div class="dexa-file-list" id="dexaFileList"></div>

				<button class="dexa-process-btn" id="dexaProcessBtn" disabled>
					🚀 Process Files
				</button>

				<div class="dexa-loading" id="dexaLoading">
					<div class="dexa-spinner"></div>
					<p>Processing your data...</p>
				</div>

				<div class="dexa-results" id="dexaResults">
					<div class="dexa-stats-grid" id="dexaStatsGrid"></div>
					<div class="dexa-success-msg">
						<p>✅ Data processed successfully and loaded into dashboard!</p>
					</div>
				</div>
			</div>
		</div>
		
		<!-- Slide-in Data Panel -->
		<div id="data-panel">
			<div id="panel-content">
				<span id="close-panel">&times;</span>
				<div id="data-content"></div>
			</div>
		</div>
	</div>

	<!-- JS dependencies -->
	<script src="js/jquery-3.6.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="js/bootstrap/bootstrap.bundle.min.js"></script>
	<script src="https://d3js.org/d3.v7.min.js"></script>
	<script src="js/main.js"></script>

</body>

</html>
