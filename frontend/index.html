<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="Bio Research Data Analysis">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>Bio Research Data Visualization</title>
	<link rel="stylesheet" href="css/style.css">
</head>

<body>

	<div class="container">
		<h1>Schuettpelz Lab - Mouse Relationship Network</h1>

		<!-- Combined Controls Bar -->
		<div id="controls-bar">
			<!-- Filter Section -->
			<div class="control-section">
				<label for="filterType"><strong>Filter by:</strong></label>
				<select id="filterType">
					<option value="all">All</option>
					<option value="wbc">WBC</option>
					<option value="neutrophils">Neutrophils</option>
					<option value="lymphocytes">Lymphocytes</option>
					<option value="monocytes">Monocytes</option>
					<option value="eosinophils">Eosinophils</option>
					<option value="basophils">Basophils</option>
					<option value="rbc">RBC</option>
					<option value="hemoglobin">Hemoglobin</option>
					<option value="hematocrit">Hematocrit</option>
					<option value="platelets">Platelets</option>
				</select>
		
				<label for="filterMin">Min:</label>
				<input type="number" id="filterMin" step="0.1" style="width:80px;">
				<label for="filterMax">Max:</label>
				<input type="number" id="filterMax" step="0.1" style="width:80px;">
				<button id="applyFilterBtn">Apply Filter</button>
				<button id="resetFilterBtn">Reset</button>
			</div>

			<!-- Grouping Section -->
			<div class="control-section">
				<label for="groupMetric"><strong>Group by:</strong></label>
				<select id="groupMetric">
					<option value="all">Select Metric</option>
					<option value="wbc">WBC</option>
					<option value="neutrophils">Neutrophils</option>
					<option value="lymphocytes">Lymphocytes</option>
					<option value="monocytes">Monocytes</option>
					<option value="eosinophils">Eosinophils</option>
					<option value="basophils">Basophils</option>
					<option value="rbc">RBC</option>
					<option value="hemoglobin">Hemoglobin</option>
					<option value="hematocrit">Hematocrit</option>
					<option value="platelets">Platelets</option>
				</select>

				<button id="addGroupBtn">+ Add Group</button>
				<button id="applyGroupingBtn">Apply Grouping</button>
				<button id="clearGroupsBtn">Clear Groups</button>

				<div id="groupRanges" style="margin-top: 10px; width: 100%;">
					<!-- Group range inputs will be added here dynamically -->
				</div>
			</div>
		</div>

		<!-- Link Buttons -->
		<div style="margin: 30px 0; padding-top: 20px; border-top: 3px solid rgba(255, 255, 255, 0.2);">
			<a href="dexa-upload.html" class="button-link">
				<button id="dexa-upload-btn">Go to DEXA Upload Page</button>
			</a>

			<a href="statstests.html" class="button-link" style="margin-left: 10px;">
				<button id="stats-tests-btn">Go to Statistical Tests Page</button>
			</a>
		</div>

		<div id="chart-area"></div>
		
		<!-- Slide-in Data Panel -->
		<div id="data-panel">
			<div id="panel-content">
				<span id="close-panel">&times;</span>
				<div id="data-content"></div>
			</div>
		</div>
	</div>

	<!-- JS dependencies -->
	<script src="js/jquery-3.6.1.min.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/popper.js@1.16.1/dist/umd/popper.min.js"></script>
	<script src="js/bootstrap/bootstrap.bundle.min.js"></script>
	<script src="https://d3js.org/d3.v7.min.js"></script>
	<script src="js/main.js"></script>

</body>

</html>
